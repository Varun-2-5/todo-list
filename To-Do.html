<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <title>ToDo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-cyan-900 flex items-center justify-center min-h-screen">
    <div class="border border-white p-20 rounded-lg bg-cyan-800 shadow-lg">
       
        <div>
             <h1 class="text-2xl font-bold text-center mb-8">To-Do List</h1>
            <input class="border bg-white rounded-md px-5 py-1" type="text" id="input-task" placeholder="Enter a task">
            
            <button class="bg-teal-600 text-white px-4 py-0.5 ml-4 rounded-md " id="addBtn" type="submit">
                Add
            </button>

            <ul id="todo-list"></ul>
            

            
        </div>
    </div>
    <script src="ToDo.js"></script>
</body>


</html>
